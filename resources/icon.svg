<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Regemark Present app icon: presentation screen with a cross, on a stand.
       Style: dark tile, neon-green inner border, white glyph with green edge. -->
  <rect x="20" y="20" width="472" height="472" rx="100" fill="#212121"/>
  <rect x="50" y="50" width="412" height="412" rx="70" fill="none" stroke="#1aff8c" stroke-width="13"/>

  <!-- Green underlay: every white stroke drawn 12px wider in green, so the
       glyph gets a 6px outline and overlapping parts merge cleanly. -->
  <g fill="none" stroke="#1aff8c" stroke-linejoin="miter">
    <rect x="118" y="112" width="276" height="190" rx="28" stroke-width="44"/>
    <path d="M256 300 V384" stroke-width="40"/>
    <path d="M188 394 H324" stroke-width="40" stroke-linecap="square"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-linejoin="miter">
    <rect x="118" y="112" width="276" height="190" rx="28" stroke-width="32"/>
    <path d="M256 300 V388" stroke-width="28"/>
    <path d="M188 394 H324" stroke-width="28" stroke-linecap="square"/>
  </g>

  <!-- Cross -->
  <path d="M240 146 H272 V178 H310 V210 H272 V272 H240 V210 H202 V178 H240 Z"
        fill="#ffffff" stroke="#1aff8c" stroke-width="7" stroke-linejoin="miter"/>
</svg>
